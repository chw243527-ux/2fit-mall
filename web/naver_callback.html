<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>네이버 로그인 처리 중...</title>
  <style>
    body { margin: 0; display: flex; align-items: center; justify-content: center;
      height: 100vh; background: #fff; font-family: Apple SD Gothic Neo, sans-serif; }
    .wrap { text-align: center; }
    .spinner { width: 40px; height: 40px; border: 3px solid #e0e0e0;
      border-top-color: #03C75A; border-radius: 50%; animation: spin .8s linear infinite;
      margin: 0 auto 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    p { color: #555; font-size: 14px; }
  </style>
</head>
<body>
  <div class="wrap"><div class="spinner"></div><p>네이버 로그인 처리 중...</p></div>
  <script>
  (function () {
    var query = new URLSearchParams(window.location.search);
    var code = query.get('code') || '';
    var state = query.get('state') || '';
    var error = query.get('error') || '';
    var redirectUri = window.location.origin + '/naver_callback.html';
    var data = { type: 'NAVER_CODE', code: code, state: state, redirectUri: redirectUri };
    if (error || !code || !state) data.error = error || '네이버 인증 코드가 없습니다.';
    if (window.opener) {
      window.opener.postMessage(data, window.location.origin);
      setTimeout(function () { window.close(); }, 100);
    } else if (!data.error) {
      var appUrl = 'twofitmall://naver?code=' + encodeURIComponent(code)
        + '&state=' + encodeURIComponent(state);
      window.location.href = appUrl;
    } else {
      document.querySelector('p').textContent = data.error || '로그인에 실패했습니다. 창을 닫아주세요.';
    }
  })();
  </script>
</body>
</html>
