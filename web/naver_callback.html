<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>네이버 로그인 처리 중...</title>
  <style>
    body {
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: #fff;
      font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
    }
    .wrap { text-align: center; }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid #e0e0e0;
      border-top-color: #03C75A;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    p { color: #555; font-size: 14px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="spinner"></div>
    <p>네이버 로그인 처리 중...</p>
  </div>

  <!-- 네이버 JS SDK (naverLogin_implicit) -->
  <script src="https://static.nid.naver.com/js/naverLogin_implicit-1.0.3.js" charset="utf-8"></script>

  <script>
  (function() {
    var CLIENT_ID   = 'RTeQb5TSs920qoowhcra';
    var CALLBACK_URL = window.location.origin + '/naver_callback.html';

    function sendToOpener(data) {
      if (window.opener) {
        window.opener.postMessage(data, window.location.origin);
        setTimeout(function() { window.close(); }, 100);
      } else {
        document.querySelector('p').textContent =
          data.error || '로그인 완료. 창을 닫아주세요.';
      }
    }

    // ── 1) URL 해시에서 access_token 파싱 ──
    var hash = window.location.hash.substring(1);
    var params = {};
    hash.split('&').forEach(function(part) {
      var kv = part.split('=');
      if (kv.length === 2) params[decodeURIComponent(kv[0])] = decodeURIComponent(kv[1]);
    });

    var token = params['access_token'];
    var error = params['error'];

    if (!token) {
      sendToOpener({ type: 'NAVER_TOKEN', error: error || '네이버 로그인에 실패했습니다.' });
      return;
    }

    // ── 2) 네이버 JS SDK로 프로필 조회 ──
    try {
      var naverLogin = new naver_id_login(CLIENT_ID, CALLBACK_URL);
      naverLogin.setAccessToken(token);
      naverLogin.getLoginStatus(function(status) {
        if (status) {
          var id       = naverLogin.getProfileData('id')            || '';
          var name     = naverLogin.getProfileData('name')          || '네이버 사용자';
          var email    = naverLogin.getProfileData('email')         || '';
          var photo    = naverLogin.getProfileData('profile_image') || '';
          if (!email && id) email = id + '@naver.com';

          sendToOpener({
            type    : 'NAVER_TOKEN',
            token   : token,
            naverId : id,
            email   : email,
            name    : name,
            photoUrl: photo
          });
        } else {
          // SDK 프로필 실패 → token만 전달 (naverId는 token 앞 16자리로 임시 생성)
          sendToOpener({
            type    : 'NAVER_TOKEN',
            token   : token,
            naverId : '',
            email   : '',
            name    : '네이버 사용자',
            photoUrl: ''
          });
        }
      });
    } catch (e) {
      // SDK 자체 오류 → token만 전달
      sendToOpener({
        type    : 'NAVER_TOKEN',
        token   : token,
        naverId : '',
        email   : '',
        name    : '네이버 사용자',
        photoUrl: ''
      });
    }
  })();
  </script>
</body>
</html>
