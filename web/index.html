  <!-- ═══════════════════════════════════════════════
       ZXing-js 바코드 스캐너 (Flutter Web 카메라 스캔)
       getUserMedia 직접 제어 + canvas 디코딩 루프
       인식률 강화: 원본 + 중앙 crop + 밝기 보정 3단 시도
       API:
         window.startBarcodeScanner(onResult, onError)
         window.stopBarcodeScanner()
         window.showCameraPreview(x, y, w, h)
         window.hideCameraPreview()
  ═══════════════════════════════════════════════ -->
  <script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
  <script>
    (function() {
      var _videoEl   = null;
      var _canvasEl  = null;
      var _stream    = null;
      var _reader    = null;
      var _active    = false;
      var _rafId     = null;
      var _lastScan  = 0;
      var SCAN_INTERVAL = 150;   // 150ms = ~6fps 분석

      // ── 모든 리소스 정리 ────────────────────────────────────────
      window.stopBarcodeScanner = function() {
        _active = false;
        if (_rafId) { cancelAnimationFrame(_rafId); _rafId = null; }
        if (_reader) { try { _reader.reset(); } catch(e) {} _reader = null; }
        if (_stream) {
          _stream.getTracks().forEach(function(t) { t.stop(); });
          _stream = null;
        }
        if (_videoEl && _videoEl.parentNode) {
          _videoEl.parentNode.removeChild(_videoEl);
        }
        _videoEl = null;
        if (_canvasEl && _canvasEl.parentNode) {
          _canvasEl.parentNode.removeChild(_canvasEl);
        }
        _canvasEl = null;
      };

      // ── canvas imageData → ZXing 디코딩 시도 (내부 헬퍼) ────────
      function tryDecode(imageData, w, h) {
        try {
          var lum    = new ZXing.RGBLuminanceSource(imageData.data, w, h);
          var binary = new ZXing.HybridBinarizer(lum);
          var bitmap = new ZXing.BinaryBitmap(binary);
          var result = _reader.decode(bitmap);
          if (result) return result.getText();
        } catch(e) { /* NotFoundException 등 정상 */ }
        return null;
      }

      // ── 밝기/대비 보정 후 imageData 반환 ────────────────────────
      function brightenImageData(imageData) {
        var d = new Uint8ClampedArray(imageData.data);
        for (var i = 0; i < d.length; i += 4) {
          d[i]   = Math.min(255, (d[i]   - 128) * 1.2 + 128 + 30);
          d[i+1] = Math.min(255, (d[i+1] - 128) * 1.2 + 128 + 30);
          d[i+2] = Math.min(255, (d[i+2] - 128) * 1.2 + 128 + 30);
        }
        return new ImageData(d, imageData.width, imageData.height);
      }

      // ── 스캐너 시작 ──────────────────────────────────────────────
      window.startBarcodeScanner = function(onResult, onError) {
        window.stopBarcodeScanner();

        _videoEl = document.createElement('video');
        _videoEl.setAttribute('playsinline', 'true');
        _videoEl.setAttribute('muted', 'true');
        _videoEl.autoplay = true;
        _videoEl.style.cssText = [
          'position:fixed', 'top:0', 'left:0',
          'width:1px', 'height:1px',
          'object-fit:cover', 'z-index:-1',
          'opacity:0', 'pointer-events:none',
        ].join(';');
        document.body.appendChild(_videoEl);

        _canvasEl = document.createElement('canvas');
        _canvasEl.style.cssText = 'position:fixed;top:-9999px;left:-9999px;pointer-events:none;';
        document.body.appendChild(_canvasEl);

        var hints = new Map();
        hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [
          ZXing.BarcodeFormat.CODE_128,
          ZXing.BarcodeFormat.CODE_39,
          ZXing.BarcodeFormat.EAN_13,
          ZXing.BarcodeFormat.EAN_8,
          ZXing.BarcodeFormat.QR_CODE,
          ZXing.BarcodeFormat.DATA_MATRIX,
          ZXing.BarcodeFormat.UPC_A,
          ZXing.BarcodeFormat.UPC_E,
        ]);
        hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
        _reader = new ZXing.MultiFormatReader();
        _reader.setHints(hints);

        // 후면 카메라 우선, 고해상도 요청
        var constraints = {
          video: {
            facingMode: { ideal: 'environment' },
            width:  { ideal: 1920 },
            height: { ideal: 1080 },
          }
        };

        _active = true;

        navigator.mediaDevices.getUserMedia(constraints)
          .catch(function() {
            return navigator.mediaDevices.getUserMedia({ video: true });
          })
          .then(function(stream) {
            if (!_active) {
              stream.getTracks().forEach(function(t) { t.stop(); });
              return;
            }
            _stream = stream;
            _videoEl.srcObject = stream;

            return _videoEl.play().then(function() {
              if (!_active) return;

              function decode() {
                if (!_active) return;

                var now = performance.now();
                if (now - _lastScan < SCAN_INTERVAL) {
                  _rafId = requestAnimationFrame(decode);
                  return;
                }
                _lastScan = now;

                var vw = _videoEl.videoWidth;
                var vh = _videoEl.videoHeight;
                if (!vw || !vh) {
                  _rafId = requestAnimationFrame(decode);
                  return;
                }

                var ctx = _canvasEl.getContext('2d');
                var text = null;

                // 시도 1: 원본 전체 프레임
                _canvasEl.width  = vw;
                _canvasEl.height = vh;
                ctx.drawImage(_videoEl, 0, 0, vw, vh);
                text = tryDecode(ctx.getImageData(0, 0, vw, vh), vw, vh);

                // 시도 2: 중앙 60% crop
                if (!text) {
                  var cw = Math.floor(vw * 0.6);
                  var ch = Math.floor(vh * 0.6);
                  var cx = Math.floor((vw - cw) / 2);
                  var cy = Math.floor((vh - ch) / 2);
                  _canvasEl.width  = cw;
                  _canvasEl.height = ch;
                  ctx.drawImage(_videoEl, cx, cy, cw, ch, 0, 0, cw, ch);
                  text = tryDecode(ctx.getImageData(0, 0, cw, ch), cw, ch);
                }

                // 시도 3: 밝기 보정 후 전체 프레임
                if (!text) {
                  _canvasEl.width  = vw;
                  _canvasEl.height = vh;
                  ctx.drawImage(_videoEl, 0, 0, vw, vh);
                  text = tryDecode(
                    brightenImageData(ctx.getImageData(0, 0, vw, vh)), vw, vh);
                }

                if (text) {
                  _active = false;
                  cancelAnimationFrame(_rafId); _rafId = null;
                  console.log('[ZXing] decoded:', text);
                  if (onResult) onResult(text);
                  return;
                }

                _rafId = requestAnimationFrame(decode);
              }

              _rafId = requestAnimationFrame(decode);
            });
          })
          .catch(function(e) {
            if (!_active) return;
            _active = false;
            var msg = (e && e.message) ? e.message : String(e);
            console.warn('[ZXing] getUserMedia error:', msg);
            var code = 'unknown';
            if (msg.indexOf('NotAllowed') >= 0 || msg.indexOf('Permission') >= 0
                || (e && e.name === 'NotAllowedError')) {
              code = 'permission_denied';
            } else if (msg.indexOf('NotReadable') >= 0 || msg.indexOf('Could not start') >= 0
                       || (e && e.name === 'NotReadableError')) {
              code = 'camera_busy';
            } else if (msg.indexOf('NotFound') >= 0 || msg.indexOf('DevicesNotFound') >= 0
                       || (e && e.name === 'NotFoundError')) {
              code = 'no_camera';
            }
            if (onError) onError(code + '|' + msg);
          });
      };

      // ── 카메라 미리보기: Flutter Dialog 위에 띄우기 ──────────────
      window.showCameraPreview = function(x, y, w, h) {
        if (!_videoEl) return;
        _videoEl.style.position     = 'fixed';
        _videoEl.style.left         = x + 'px';
        _videoEl.style.top          = y + 'px';
        _videoEl.style.width        = w + 'px';
        _videoEl.style.height       = h + 'px';
        _videoEl.style.objectFit    = 'cover';
        _videoEl.style.zIndex       = '999';
        _videoEl.style.opacity      = '1';
        _videoEl.style.borderRadius = '12px';
        _videoEl.style.pointerEvents = 'none';

        _videoEl.style.opacity = '0';

  <!-- ═══════════════════════════════════════════════
       네이버 OAuth 2.0 팝업 로그인 헬퍼
       팝업창에서 콜백을 받아 Flutter로 전달
  ═══════════════════════════════════════════════ -->
  <script>
    // 네이버 OAuth 팝업 로그인: Secret은 Firebase Functions 서버에서만 사용
    window.naverOAuthLogin = async function() {
      var redirectUri = window.location.origin + '/naver_callback.html';
      var startEndpoint = 'https://us-central1-fit-mall.cloudfunctions.net/startNaverOAuth';

      // Open synchronously during the user gesture. iOS Safari can drop
      // window.opener if window.open happens after an awaited fetch.
      var popup = window.open('about:blank', 'naverLogin',
        'width=500,height=600,scrollbars=yes,resizable=yes');
      if (!popup) throw new Error('팝업이 차단되었습니다. 팝업을 허용해 주세요.');

      try {
        var response = await fetch(startEndpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ redirectUri: redirectUri })
        });
        var start = await response.json();
        if (!response.ok || !start.authorizeUrl) {
          popup.close();
          throw new Error(start.error || '네이버 로그인을 시작할 수 없습니다.');
        }
        popup.location.href = start.authorizeUrl;
      } catch (error) {
        try { popup.close(); } catch (_) {}
        throw error;
      }

      return new Promise(function(resolve, reject) {
        var timer = setInterval(function() {
          if (popup.closed) {
            clearInterval(timer);
            window.removeEventListener('message', onMessage);
            reject(new Error('팝업이 닫혔습니다.'));
          }
        }, 500);

        function onMessage(e) {
          if (e.origin !== window.location.origin) return;
          if (e.data && e.data.type === 'NAVER_CODE') {
            clearInterval(timer);
            window.removeEventListener('message', onMessage);
            popup.close();
            if (e.data.error) reject(new Error(e.data.error));
            else resolve(e.data);
          }
        }
        window.addEventListener('message', onMessage);
      });
    };
  </script>

  <script>
    // ── Payment Widget 전역 인스턴스 ──────────────────────────────
    // Flutter checkout 페이지에서 initTossWidget() → renderTossWidget()
    // → submitTossWidget() 순서로 호출합니다.
    window._tossWidgets = null;   // PaymentWidget 인스턴스
    window._tossAmount   = 0;     // 금액 (renderPaymentMethods 호출 시 사용)

    /**
     * 1단계: 위젯 초기화 (금액 저장만 — 렌더 시 사용)
     *  params: { clientKey, customerKey, amount }
     *  비로그인: customerKey = '@@ANONYMOUS'
     *
     *  v1 API: PaymentWidget(clientKey, customerKey) → instance
     *  setAmount() 없음 — 금액은 renderPaymentMethods(selector, amount) 두번째 인자로 전달
     */
    window.initTossWidget = async function(params) {
      try {
        const widgets = PaymentWidget(params.clientKey, params.customerKey);
        window._tossWidgets = widgets;
        window._tossAmount  = params.amount;
        if (window._tossWidgetInitCallback) {
          window._tossWidgetInitCallback('ok');
        }
      } catch (e) {
        if (window._tossWidgetInitCallback) {
          window._tossWidgetInitCallback('error:' + (e.message || e.toString()));
        }
      }
    };

    /**
     * 2단계: 결제수단 UI + 이용약관 렌더링
     *  DOM에 id="payment-method" 와 id="agreement" div가 있어야 합니다.
     *
     *  v1 API:
     *    renderPaymentMethods(selector, amount, options?) → PaymentMethodsWidget
     *    renderAgreement(selector, options?)              → AgreementWidget
     */
    window.renderTossWidget = async function() {
      try {
        if (!window._tossWidgets) throw new Error('widget not initialized');
        await Promise.all([
          window._tossWidgets.renderPaymentMethods(
            '#payment-method',
            { currency: 'KRW', value: window._tossAmount }
          ),
          window._tossWidgets.renderAgreement('#agreement'),
        ]);
        if (window._tossWidgetRenderCallback) {
          window._tossWidgetRenderCallback('ok');
        }
      } catch (e) {
        if (window._tossWidgetRenderCallback) {
          window._tossWidgetRenderCallback('error:' + (e.message || e.toString()));
        }
      }
    };

    /**
     * 금액 업데이트 (쿠폰 등 적용 시)
     *  params: { amount }
     *  v1: PaymentMethodsWidget.updateAmount(amount) 사용
     */
    window.updateTossWidgetAmount = async function(params) {
      try {
        if (!window._tossPaymentMethodsWidget) return;
        window._tossPaymentMethodsWidget.updateAmount(params.amount);
        window._tossAmount = params.amount;
      } catch (e) { /* ignore */ }
    };

    /**
     * 3단계: 결제 요청 (결제하기 버튼 클릭 시)
     *  params: { orderId, orderName, customerName, customerEmail,
     *            customerMobilePhone, successUrl, failUrl }
     */
    window.submitTossWidget = async function(params) {
      try {
        if (!window._tossWidgets) throw new Error('widget not initialized');
        await window._tossWidgets.requestPayment({
          orderId:             params.orderId,
          orderName:           params.orderName,
          customerName:        params.customerName,
          customerEmail:       params.customerEmail,
          customerMobilePhone: params.customerMobilePhone || '',
          successUrl:          params.successUrl,
          failUrl:             params.failUrl,
        });
        // 성공 시 successUrl로 리디렉션되므로 여기에 도달하지 않음
      } catch (e) {
        if (window._tossWidgetSubmitCallback) {
          window._tossWidgetSubmitCallback('error:' + (e.message || e.toString()));
        }
      }
    };
  </script>

  <script>
    // ── 배포 버전 폴링: 열려있는 탭도 새 배포 감지 시 자동 새로고침 ──────
    // flutter_bootstrap.js는 매 빌드마다 내용이 바뀌고 no-cache이므로
    // ETag/Last-Modified로 변경 감지 → window.location.reload() 호출
    (function() {
      var CHECK_INTERVAL = 30 * 1000; // 30초마다 체크
      var lastETag = null;
      var lastModified = null;
      var checking = false;

      function checkVersion() {
        if (checking || document.hidden) return; // 탭 비활성 중엔 건너뜀
        checking = true;
        fetch('flutter_bootstrap.js?_vc=' + Date.now(), {
          method: 'HEAD',
          cache: 'no-store'
        })
        .then(function(res) {
          var etag = res.headers.get('etag');
          var lm   = res.headers.get('last-modified');
          if (lastETag === null && lastModified === null) {
            // 최초 로드 시 기준값 저장
            lastETag = etag;
            lastModified = lm;
          } else {
            // 기준값과 달라지면 새 배포 → 새로고침
            var changed = (etag && etag !== lastETag) ||
                          (!etag && lm && lm !== lastModified);
            if (changed) {
              console.log('[2FIT] 새 버전 감지 — 자동 새로고침');
              window.location.reload();
            }
          }
        })
        .catch(function() { /* 네트워크 오류 시 무시 */ })
        .finally(function() { checking = false; });
      }

      // 페이지 로드 후 5초 뒤 첫 기준값 설정
      window.addEventListener('load', function() {
        setTimeout(checkVersion, 5000);
        setInterval(checkVersion, CHECK_INTERVAL);
      });

      // 탭이 다시 활성화될 때 즉시 체크 (자리 비웠다 돌아왔을 때)
      document.addEventListener('visibilitychange', function() {
        if (!document.hidden) setTimeout(checkVersion, 500);
      });
    })();

    // ── Service Worker 등록 & 자동 업데이트 ──────────────────────────────
    // Firebase Messaging과 Flutter PWA 처리를 통합한 워커를 등록합니다.
    // firebase-messaging-sw.js가 내부에서 flutter_service_worker.js를 로드합니다.
    // 새 버전이 배포되면 SW가 자동 감지 → 페이지를 자동 새로고침하여
    // 홈화면 추가(PWA) 상태에서도 항상 최신 버전이 표시됩니다.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('firebase-messaging-sw.js', {scope: '/'})
          .then(function(reg) {
            // ── 페이지 로드 시 즉시 업데이트 체크 (캐시 우회) ──
            reg.update();

            // 새 SW가 설치(대기) 상태가 되면 즉시 활성화
            reg.addEventListener('updatefound', function() {
              var newWorker = reg.installing;
              if (!newWorker) return;
              newWorker.addEventListener('statechange', function() {
                // installed 상태 = 새 버전 준비 완료
                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                  // 현재 SW에게 skipWaiting 메시지 전송
                  newWorker.postMessage({type: 'SKIP_WAITING'});
                }
              });
            });
          })
          .catch(function(e) { console.warn('[SW] 등록 실패:', e); });

        // SW 교체 시 자동 새로고침은 Flutter 초기화와 충돌할 수 있으므로 사용하지 않습니다.
        // 다음 페이지 방문 또는 브라우저의 일반 업데이트 주기에 새 워커가 적용됩니다.
      });
    }

    // ── 강제 캐시 삭제 (구버전 SW 캐시 완전 제거) ───────────────────
    // CACHE_SENTINEL 값은 deploy.yml Step 6에서 빌드 번호로 자동 교체됨
    var _keepCache = 'flutter-app-cache-BUILD_NUMBER';
    if ('caches' in window) {
      caches.keys().then(function(names) {
        names.forEach(function(name) {
          if (name !== _keepCache) {
            caches.delete(name);
          }
        });
      });
    }

    // bfcache(앞뒤로 캐시) 복원 시 새로고침 - Flutter 재초기화
    window.addEventListener('pageshow', function(e) {
      if (e.persisted) { window.location.reload(); }
    });

    // Flutter 첫 프레임 완료 → 로딩화면 제거
    function removeLoadingScreen() {
      var el = document.getElementById('loading-screen');
      if (el) {
        el.style.transition = 'opacity 0.3s';
        el.style.opacity = '0';
        setTimeout(function() { if (el && el.parentNode) el.remove(); }, 300);
      }
    }
    window.addEventListener('flutter-first-frame', removeLoadingScreen);

    // 안전장치: 첫 프레임 이벤트가 누락되어도 8초 후에는 앱 화면을 표시
    // Flutter 화면이 준비된 상태에서 로딩 오버레이가 오래 남지 않도록 합니다.
    setTimeout(removeLoadingScreen, 8000);

  <script>
    let deferredPrompt = null;
    let pwaInstallShown = false;

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      
      // 5초 후 설치 배너 표시 (첫 방문 또는 3일에 한 번)
      const lastShown = localStorage.getItem('pwa_install_shown');
      const now = Date.now();
      const threeDays = 3 * 24 * 60 * 60 * 1000;
      
      if (!lastShown || (now - parseInt(lastShown)) > threeDays) {
        setTimeout(() => {
          if (!pwaInstallShown && deferredPrompt) {
            showPwaInstallBanner();
          }
        }, 5000);
      }
    });

    function showPwaInstallBanner() {
      if (pwaInstallShown) return;
      pwaInstallShown = true;
      localStorage.setItem('pwa_install_shown', Date.now().toString());

      const banner = document.createElement('div');
      banner.id = 'pwa-install-banner';
      banner.innerHTML = `
        <div style="
          position: fixed;
          bottom: 80px;
          left: 50%;
          transform: translateX(-50%);
          background: #1A1A2E;
          color: white;
          border-radius: 16px;

          width: calc(100% - 32px);
          animation: slideUp 0.3s ease;
        ">

          <div style="flex:1;">

            <div style="font-size:12px;opacity:0.8;">홈 화면에 추가하고 빠르게 쇼핑하세요</div>
          </div>
          <button id="pwa-install-btn" style="
            background:#6C63FF;color:white;border:none;
            padding:8px 14px;border-radius:8px;
            font-size:13px;font-weight:700;cursor:pointer;
            white-space:nowrap;
          ">추가</button>
          <button id="pwa-close-btn" style="
            background:transparent;color:rgba(255,255,255,0.6);
            border:none;font-size:20px;cursor:pointer;padding:0;
            line-height:1;
          ">×</button>

          @keyframes slideUp {
            from { transform: translateX(-50%) translateY(20px); opacity: 0; }
            to { transform: translateX(-50%) translateY(0); opacity: 1; }
          }
        </style>
      `;
      document.body.appendChild(banner);
      document.body.classList.add('pwa-banner-visible');

      document.getElementById('pwa-install-btn').addEventListener('click', async () => {
        if (deferredPrompt) {
          deferredPrompt.prompt();
          const { outcome } = await deferredPrompt.userChoice;
          if (outcome === 'accepted') {
            console.log('[PWA] 홈 화면에 추가됨');
          }
          deferredPrompt = null;
        }
        removeBanner();
      });

      document.getElementById('pwa-close-btn').addEventListener('click', removeBanner);

      // 8초 후 자동 제거
      setTimeout(removeBanner, 8000);
    }

    function removeBanner() {
      document.body.classList.remove('pwa-banner-visible');
      const banner = document.getElementById('pwa-install-banner');
      if (banner) {
        banner.style.opacity = '0';
        banner.style.transition = 'opacity 0.3s';
        setTimeout(() => banner.remove(), 300);
      }
    }

    window.addEventListener('appinstalled', () => {
      console.log('[PWA] 앱이 설치되었습니다');
      deferredPrompt = null;
      removeBanner();
    });
  </script>
