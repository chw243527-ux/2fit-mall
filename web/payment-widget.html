<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>결제</title>
  <script src="https://js.tosspayments.com/v2/standard"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
    }

    /* 로딩 */
    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 60vh;
      gap: 16px;
      color: #666;
      font-size: 14px;
    }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid #e0e0e0;
      border-top-color: #0064FF;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* 에러 */
    #error-view {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      gap: 12px;
      text-align: center;
    }
    #error-view .icon  { font-size: 48px; }
    #error-view .title { font-size: 18px; font-weight: 700; color: #1a1a1a; }
    #error-view .msg   { font-size: 13px; color: #e53935; line-height: 1.5; }
    #error-view .back-btn {
      margin-top: 8px;
      padding: 14px 32px;
      background: #1a1a2e;
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      max-width: 320px;
    }

    /* 위젯 영역 */
    #widget-view { display: none; }

    .order-info {
      background: #fff;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .order-name {
      font-size: 14px; font-weight: 600; color: #1a1a1a;
      flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .order-amount {
      font-size: 18px; font-weight: 900; color: #0064FF;
      margin-left: 12px; white-space: nowrap;
    }

    #payment-method { background: #fff; }
    #agreement      { background: #fff; }

    /* 에러 메시지 */
    #submit-error {
      margin: 0 16px 8px;
      padding: 12px;
      background: #ffebee;
      border: 1px solid #ef9a9a;
      border-radius: 8px;
      color: #e53935;
      font-size: 13px;
      display: none;
    }

    /* 결제 버튼 */
    .pay-btn-wrap { padding: 16px; background: #f5f5f5; }
    #payment-button {
      width: 100%; height: 56px;
      background: #0064FF;
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 17px; font-weight: 800;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    #payment-button:disabled { opacity: 0.5; cursor: not-allowed; }
    #payment-button .btn-spinner {
      width: 20px; height: 20px;
      border: 2px solid rgba(255,255,255,0.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: none;
    }
    #payment-button.loading .btn-spinner { display: block; }
    #payment-button.loading .btn-text    { display: none; }
  </style>
</head>
<body>

  <div id="loading">
    <div class="spinner"></div>
    <span>결제 수단을 불러오는 중...</span>
  </div>

  <div id="error-view">
    <div class="icon">⚠️</div>
    <div class="title">결제 위젯 로드 실패</div>
    <div class="msg" id="error-msg"></div>
    <button class="back-btn" onclick="history.back()">뒤로 가기</button>
  </div>

  <div id="widget-view">
    <div class="order-info">
      <div class="order-name"   id="order-name-el"></div>
      <div class="order-amount" id="order-amount-el"></div>
    </div>
    <div id="payment-method"></div>
    <div id="agreement"></div>
    <div id="submit-error"></div>
    <div class="pay-btn-wrap">
      <button id="payment-button">
        <div class="btn-spinner"></div>
        <span class="btn-text" id="pay-btn-text">결제하기</span>
      </button>
    </div>
  </div>

  <script>
    // ── 리다이렉트 모드: 토스 콜백 → top.location으로 전달 ──────────────────
    // 토스페이먼츠가 successUrl/failUrl로 iframe 안에서 리다이렉트할 때
    // 이 페이지를 중간 경유지로 사용하여 top(Flutter)으로 이동시킵니다.
    (function handleRedirect() {
      const rp = new URLSearchParams(location.search);
      if (rp.get('_redirect') !== '1') return;

      const target = rp.get('_target');
      if (!target) return;

      // 토스가 붙여준 나머지 파라미터(paymentKey, orderId, amount, code, message 등)를
      // target URL에 합쳐서 top으로 이동
      const targetUrl = new URL(decodeURIComponent(target));
      rp.forEach((v, k) => {
        if (k !== '_redirect' && k !== '_target') {
          targetUrl.searchParams.set(k, v);
        }
      });

      try {
        top.location.href = targetUrl.toString();
      } catch (e) {
        // cross-origin 차단 시 현재 창에서 이동 (fallback)
        location.href = targetUrl.toString();
      }
    })();

    main();

    async function main() {
      // ── 1. URL 파라미터 ───────────────────────────────────────────────────
      const p = new URLSearchParams(location.search);
      // _redirect 모드면 main() 실행 안 함
      if (p.get('_redirect') === '1') return;

      // 결제위젯은 일반 위젯 클라이언트 키(test_ck_/live_ck_)로 초기화합니다.
      // 간편결제용 gck 키는 위젯 초기화 키로 사용하지 않습니다.
      const clientKey           = p.get('clientKey') || '';
      const rawCustomerKey      = p.get('customerKey')          || '';
      const orderId             = p.get('orderId')              || '';
      const orderName           = p.get('orderName')            || '주문';
      const amount              = parseInt(p.get('amount')      || '0', 10);
      const customerName        = p.get('customerName')         || '';
      const customerEmail       = p.get('customerEmail')        || '';
      const successUrl          = p.get('successUrl')           || '';
      const failUrl             = p.get('failUrl')              || '';
      const rawPhone            = (p.get('customerMobilePhone') || '').replace(/\D/g, '');
      const customerMobilePhone = rawPhone.length >= 10 ? rawPhone : undefined;

      // ── 2. 주문 정보 표시 ─────────────────────────────────────────────────
      const amtFmt = amount.toLocaleString('ko-KR');
      document.getElementById('order-name-el').textContent   = orderName;
      document.getElementById('order-amount-el').textContent = amtFmt + '원';
      document.getElementById('pay-btn-text').textContent    = amtFmt + '원 결제하기';

      try {
        if (!clientKey)             throw new Error('clientKey가 없습니다.');
        if (!orderId)               throw new Error('orderId가 없습니다.');
        if (!amount || amount <= 0) throw new Error('결제 금액이 올바르지 않습니다.');

        // ── 3. 결제위젯 초기화 ───────────────────────────────────────────────
        // 스크립트 태그 방식: TossPayments(clientKey)
        // 비회원: TossPayments.ANONYMOUS / 회원: rawCustomerKey
        const tossPayments = TossPayments(clientKey);

        const customerKey = (rawCustomerKey && rawCustomerKey !== TossPayments.ANONYMOUS)
          ? rawCustomerKey
          : TossPayments.ANONYMOUS;

        // ── 4. 주문서형 결제 위젯 ────────────────────────────────────────────
        // https://docs.tosspayments.com/guides/v2/payment-widget/integration
        const widgets = tossPayments.widgets({ customerKey });

        await widgets.setAmount({ currency: 'KRW', value: amount });

        const [paymentMethodWidget, agreementWidget] = await Promise.all([
          widgets.renderPaymentMethods({
            selector: '#payment-method',
            variantKey: 'DEFAULT',
          }),
          widgets.renderAgreement({
            selector: '#agreement',
            variantKey: 'AGREEMENT',
          }),
        ]);

        // ── 5. 위젯 표시 ──────────────────────────────────────────────────────
        document.getElementById('loading').style.display     = 'none';
        document.getElementById('widget-view').style.display = 'block';

        // ── 6. 결제하기 버튼 ──────────────────────────────────────────────────
        document.getElementById('payment-button').addEventListener('click', async function () {
          const btn   = document.getElementById('payment-button');
          const errEl = document.getElementById('submit-error');

          btn.disabled = true;
          btn.classList.add('loading');
          errEl.style.display = 'none';

          try {
            const paymentMethod = await paymentMethodWidget.getSelectedPaymentMethod();
            console.log('paymentMethod:', paymentMethod);

            // requestPayment는 팝업/리다이렉트 방식으로 동작합니다.
            // 이 iframe이 top-level 창 안에 있으므로 successUrl/failUrl로의
            // 리다이렉트가 iframe 내부에서 발생합니다.
            // → top.location으로 강제 이동해 Flutter 라우터가 처리하도록 합니다.
            const wrappedSuccessUrl = location.origin
              + '/payment-widget.html?_redirect=1'
              + '&_target=' + encodeURIComponent(successUrl);
            const wrappedFailUrl = location.origin
              + '/payment-widget.html?_redirect=1'
              + '&_target=' + encodeURIComponent(failUrl);

            await widgets.requestPayment({
              orderId,
              orderName,
              successUrl: wrappedSuccessUrl,
              failUrl:    wrappedFailUrl,
              customerName,
              customerEmail,
              ...(customerMobilePhone ? { customerMobilePhone } : {}),
            });

          } catch (err) {
            console.log('err:', err);
            if (err?.code !== 'PAY_PROCESS_CANCELED' && err?.code !== 'USER_CANCEL') {
              errEl.textContent   = err?.message || '결제 요청에 실패했습니다.';
              errEl.style.display = 'block';
            }
            btn.disabled = false;
            btn.classList.remove('loading');
          }
        });

      } catch (e) {
        console.error('init error:', e);
        document.getElementById('loading').style.display    = 'none';
        document.getElementById('error-view').style.display = 'flex';
        document.getElementById('error-msg').textContent    = e?.message || '알 수 없는 오류';
      }
    }
  </script>
</body>
</html>
