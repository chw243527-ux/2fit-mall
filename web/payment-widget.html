<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>결제</title>
  <!-- 토스페이먼츠 v2 SDK — 스크립트 태그 방식 -->
  <script src="https://js.tosspayments.com/v2/standard"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
    }

    /* ── 로딩 ── */
    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 60vh;
      gap: 16px;
      color: #666;
      font-size: 14px;
    }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid #e0e0e0;
      border-top-color: #0064FF;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── 에러 ── */
    #error-view {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      gap: 12px;
      text-align: center;
    }
    #error-view .icon  { font-size: 48px; }
    #error-view .title { font-size: 18px; font-weight: 700; color: #1a1a1a; }
    #error-view .msg   { font-size: 13px; color: #e53935; line-height: 1.5; }
    #error-view button {
      margin-top: 8px;
      padding: 14px 32px;
      background: #1a1a2e;
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      max-width: 320px;
    }

    /* ── 위젯 본체 ── */
    #widget-view { display: none; }

    .order-info {
      background: #fff;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .order-name {
      font-size: 14px; font-weight: 600; color: #1a1a1a;
      flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .order-amount {
      font-size: 18px; font-weight: 900; color: #0064FF;
      margin-left: 12px; white-space: nowrap;
    }

    #payment-method { background: #fff; }
    #agreement      { background: #fff; }

    /* ── 오류 메시지 ── */
    #submit-error {
      margin: 0 16px 8px;
      padding: 12px;
      background: #ffebee;
      border: 1px solid #ef9a9a;
      border-radius: 8px;
      color: #e53935;
      font-size: 13px;
      display: none;
    }

    /* ── 결제 버튼 ── */
    .pay-btn-wrap { padding: 16px; background: #f5f5f5; }
    #payment-button {
      width: 100%; height: 56px;
      background: #0064FF;
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 17px; font-weight: 800;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    #payment-button:disabled { opacity: 0.5; cursor: not-allowed; }
    #payment-button .btn-spinner {
      width: 20px; height: 20px;
      border: 2px solid rgba(255,255,255,0.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: none;
    }
    #payment-button.loading .btn-spinner { display: block; }
    #payment-button.loading .btn-text    { display: none; }
  </style>
</head>
<body>

  <!-- 로딩 -->
  <div id="loading">
    <div class="spinner"></div>
    <span>결제 수단을 불러오는 중...</span>
  </div>

  <!-- 에러 -->
  <div id="error-view">
    <div class="icon">⚠️</div>
    <div class="title">결제 위젯 로드 실패</div>
    <div class="msg" id="error-msg"></div>
    <button onclick="history.back()">뒤로 가기</button>
  </div>

  <!-- 위젯 본체 -->
  <div id="widget-view">
    <div class="order-info">
      <div class="order-name"   id="order-name-el"></div>
      <div class="order-amount" id="order-amount-el"></div>
    </div>
    <!-- 결제 UI -->
    <div id="payment-method"></div>
    <!-- 이용약관 UI -->
    <div id="agreement"></div>
    <div id="submit-error"></div>
    <!-- 결제하기 버튼 -->
    <div class="pay-btn-wrap">
      <button id="payment-button">
        <div class="btn-spinner"></div>
        <span class="btn-text" id="pay-btn-text">결제하기</span>
      </button>
    </div>
  </div>

  <script>
    main();

    async function main() {
      // ── URL 파라미터 파싱 ────────────────────────────────────────────
      const p = new URLSearchParams(location.search);

      // ⚠️ v2 결제위젯은 "결제위젯 연동 키" (gck_...) 사용.
      //    easyPayClientKey(gck) 우선, 없으면 clientKey(ck) fallback.
      const rawClientKey     = p.get('clientKey')        || '';
      const easyPayClientKey = p.get('easyPayClientKey') || '';
      const clientKey        = easyPayClientKey || rawClientKey;

      const rawCustomerKey = p.get('customerKey') || '';
      const orderId        = p.get('orderId')     || '';
      const orderName      = p.get('orderName')   || '주문';
      const amount         = parseInt(p.get('amount') || '0', 10);
      const customerName   = p.get('customerName')   || '';
      const customerEmail  = p.get('customerEmail')  || '';
      const successUrl     = p.get('successUrl')     || '';
      const failUrl        = p.get('failUrl')        || '';

      // 전화번호: 숫자만, 10자리 미만이면 omit
      const rawPhone = (p.get('customerMobilePhone') || '').replace(/[^0-9]/g, '');
      const customerMobilePhone = rawPhone.length >= 10 ? rawPhone : undefined;

      // ── UI 초기 텍스트 ──────────────────────────────────────────────
      const amtFmt = amount.toLocaleString('ko-KR');
      document.getElementById('order-name-el').textContent   = orderName;
      document.getElementById('order-amount-el').textContent = amtFmt + '원';
      document.getElementById('pay-btn-text').textContent    = amtFmt + '원 결제하기';

      const button = document.getElementById('payment-button');

      try {
        // 파라미터 검증
        if (!clientKey)             throw new Error('clientKey가 없습니다.');
        if (!orderId)               throw new Error('orderId가 없습니다.');
        if (!amount || amount <= 0) throw new Error('결제 금액이 올바르지 않습니다.');

        // ── 결제위젯 초기화 (공식 문서 스크립트 태그 방식) ─────────────
        const tossPayments = TossPayments(clientKey);

        // 회원: customerKey 사용 / 비회원: TossPayments.ANONYMOUS
        const customerKey = (rawCustomerKey && rawCustomerKey !== TossPayments.ANONYMOUS)
          ? rawCustomerKey
          : TossPayments.ANONYMOUS;

        const widgets = tossPayments.widgets({ customerKey });

        // ── 주문의 결제 금액 설정 ────────────────────────────────────
        await widgets.setAmount({
          currency: 'KRW',
          value: amount,
        });

        await Promise.all([
          // ── 결제 UI 렌더링 ────────────────────────────────────────
          widgets.renderPaymentMethods({
            selector: '#payment-method',
            variantKey: 'DEFAULT',
          }),
          // ── 이용약관 UI 렌더링 ───────────────────────────────────
          widgets.renderAgreement({
            selector: '#agreement',
            variantKey: 'AGREEMENT',
          }),
        ]);

        // ── 위젯 표시 ────────────────────────────────────────────────
        document.getElementById('loading').style.display     = 'none';
        document.getElementById('widget-view').style.display = 'block';

        // ── '결제하기' 버튼 누르면 결제창 띄우기 ─────────────────────
        button.addEventListener('click', async function () {
          const errEl = document.getElementById('submit-error');
          button.disabled = true;
          button.classList.add('loading');
          errEl.style.display = 'none';

          try {
            await widgets.requestPayment({
              orderId,
              orderName,
              successUrl,
              failUrl,
              customerEmail,
              customerName,
              ...(customerMobilePhone ? { customerMobilePhone } : {}),
            });
            // 성공 → successUrl 리디렉션

          } catch (err) {
            console.log('[TossPayments] err:', err);
            // 취소는 조용히 처리
            if (err?.code !== 'PAY_PROCESS_CANCELED' && err?.code !== 'USER_CANCEL') {
              errEl.textContent   = err?.message || '결제 요청에 실패했습니다.';
              errEl.style.display = 'block';
            }
            button.disabled = false;
            button.classList.remove('loading');
          }
        });

      } catch (e) {
        console.error('[TossPayments] init error:', e);
        document.getElementById('loading').style.display     = 'none';
        document.getElementById('widget-view').style.display = 'none';
        document.getElementById('error-view').style.display  = 'flex';
        document.getElementById('error-msg').textContent     = e?.message || '알 수 없는 오류';
      }
    }
  </script>
</body>
</html>
