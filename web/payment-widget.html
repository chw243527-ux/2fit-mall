<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>결제</title>
  <!--
    토스페이먼츠 v2 SDK (CDN)
    window.TossPayments  — 초기화 함수 (동기)
    window.loadTossPayments — 초기화 함수 (비동기, 공식 샘플 방식)
    window.TossPayments.ANONYMOUS — 비회원 customerKey 상수 ("@@ANONYMOUS")
  -->
  <script src="https://js.tosspayments.com/v2/standard"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
    }

    /* ── 로딩 ── */
    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 60vh;
      gap: 16px;
      color: #666;
      font-size: 14px;
    }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid #e0e0e0;
      border-top-color: #0064FF;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── 에러 ── */
    #error-view {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      gap: 12px;
      text-align: center;
    }
    #error-view .icon  { font-size: 48px; }
    #error-view .title { font-size: 18px; font-weight: 700; color: #1a1a1a; }
    #error-view .msg   { font-size: 13px; color: #e53935; line-height: 1.5; }
    #error-view button {
      margin-top: 8px;
      padding: 14px 32px;
      background: #1a1a2e;
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      max-width: 320px;
    }

    /* ── 위젯 본체 ── */
    #widget-view { display: none; }

    .order-info {
      background: #fff;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .order-name {
      font-size: 14px; font-weight: 600; color: #1a1a1a;
      flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .order-amount {
      font-size: 18px; font-weight: 900; color: #0064FF;
      margin-left: 12px; white-space: nowrap;
    }

    #payment-method { background: #fff; }
    #agreement      { background: #fff; }

    /* ── 결제 버튼 오류 메시지 ── */
    #submit-error {
      margin: 0 16px 8px;
      padding: 12px;
      background: #ffebee;
      border: 1px solid #ef9a9a;
      border-radius: 8px;
      color: #e53935;
      font-size: 13px;
      display: none;
    }

    /* ── 결제 버튼 ── */
    .pay-btn-wrap { padding: 16px; background: #f5f5f5; }
    #pay-btn {
      width: 100%; height: 56px;
      background: #0064FF;
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 17px; font-weight: 800;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    #pay-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    #pay-btn .btn-spinner {
      width: 20px; height: 20px;
      border: 2px solid rgba(255,255,255,0.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: none;
    }
    #pay-btn.loading .btn-spinner { display: block; }
    #pay-btn.loading .btn-text    { display: none; }
  </style>
</head>
<body>

  <!-- 로딩 -->
  <div id="loading">
    <div class="spinner"></div>
    <span>결제 수단을 불러오는 중...</span>
  </div>

  <!-- 에러 -->
  <div id="error-view">
    <div class="icon">⚠️</div>
    <div class="title">결제 위젯 로드 실패</div>
    <div class="msg" id="error-msg"></div>
    <button onclick="history.back()">뒤로 가기</button>
  </div>

  <!-- 위젯 본체 -->
  <div id="widget-view">
    <div class="order-info">
      <div class="order-name"   id="order-name-el"></div>
      <div class="order-amount" id="order-amount-el"></div>
    </div>
    <div id="payment-method"></div>
    <div id="agreement"></div>
    <div id="submit-error"></div>
    <div class="pay-btn-wrap">
      <!-- id="payment-request-button" : 공식 샘플과 동일한 id 사용 -->
      <button id="payment-request-button">
        <div class="btn-spinner"></div>
        <span class="btn-text" id="pay-btn-text">결제하기</span>
      </button>
    </div>
  </div>

  <script>
    // ── URL 파라미터 파싱 ──────────────────────────────────────────────────
    const p = new URLSearchParams(location.search);

    //
    // ⚠️ 토스페이먼츠 v2 결제위젯 SDK 키 규칙:
    //   - "주문서형·결제창형 연동 키" (live_gck_... / test_gck_...)  ← 반드시 이 키 사용
    //   - "API 개별 연동 키" (live_ck_... / test_ck_...) 사용 시
    //     NOT_SUPPORTED_API_INDIVIDUAL_KEY 오류 발생
    //
    // Flutter → easyPayClientKey(gck) 가 항상 전달되므로 우선 사용.
    // gck 없을 경우 ck 로 fallback (테스트 환경 등).
    //
    const rawClientKey     = p.get('clientKey')          || '';
    const easyPayClientKey = p.get('easyPayClientKey')   || '';
    const widgetKey        = easyPayClientKey || rawClientKey; // v2 위젯 초기화 키

    const rawCustomerKey = p.get('customerKey') || '';
    const orderId        = p.get('orderId')     || '';
    const orderName      = p.get('orderName')   || '주문';
    const amount         = parseInt(p.get('amount') || '0', 10);
    const customerName   = p.get('customerName')   || '';
    const customerEmail  = p.get('customerEmail')  || '';
    const successUrl     = p.get('successUrl')     || '';
    const failUrl        = p.get('failUrl')        || '';

    // 전화번호: 숫자만 추출, 10자리 미만이면 omit
    const rawPhone = (p.get('customerMobilePhone') || '').replace(/[^0-9]/g, '');
    const customerMobilePhone = rawPhone.length >= 10 ? rawPhone : undefined;

    // ── ANONYMOUS 상수 처리 ───────────────────────────────────────────────
    // CDN 로드 후 window.TossPayments.ANONYMOUS === "@@ANONYMOUS"
    // Flutter에서 uid 없을 때 "@@ANONYMOUS" 문자열을 전달하므로 동일하게 동작.
    // SDK가 로드된 뒤 상수를 참조하기 위해 main() 내부에서 결정.

    // ── UI 초기 텍스트 ────────────────────────────────────────────────────
    const amtFmt = amount.toLocaleString('ko-KR');
    document.getElementById('order-name-el').textContent   = orderName;
    document.getElementById('order-amount-el').textContent = amtFmt + '원';
    document.getElementById('pay-btn-text').textContent    = amtFmt + '원 결제하기';

    // ── 헬퍼 ──────────────────────────────────────────────────────────────
    function showError(msg) {
      document.getElementById('loading').style.display     = 'none';
      document.getElementById('widget-view').style.display = 'none';
      document.getElementById('error-view').style.display  = 'flex';
      document.getElementById('error-msg').textContent     = msg;
    }

    // ── 메인 (공식 샘플 구조 그대로 적용) ────────────────────────────────
    const main = async () => {

      try {
        // 파라미터 검증
        if (!widgetKey)           throw new Error('clientKey가 없습니다.');
        if (!orderId)             throw new Error('orderId가 없습니다.');
        if (!amount || amount <= 0) throw new Error('결제 금액이 올바르지 않습니다.');

        // ── 1. loadTossPayments (async) ───────────────────────────────
        // CDN v2/standard 로드 시 window.loadTossPayments 함수가 노출됨.
        // 공식 샘플: await loadTossPayments(clientKey)
        const tossPayments = await loadTossPayments(widgetKey);

        // ── 2. widgets 인스턴스 생성 ──────────────────────────────────
        // ANONYMOUS 상수: SDK 로드 후 사용 가능
        // rawCustomerKey가 비어있거나 "@@ANONYMOUS"이면 ANONYMOUS 상수 사용
        const ANONYMOUS = window.TossPayments?.ANONYMOUS ?? '@@ANONYMOUS';
        const customerKey = (rawCustomerKey && rawCustomerKey !== '@@ANONYMOUS')
          ? rawCustomerKey
          : ANONYMOUS;

        const widgets = tossPayments.widgets({ customerKey });

        // ── 3. 금액 설정 (renderPaymentMethods 보다 반드시 선행) ──────
        await widgets.setAmount({
          currency: 'KRW',
          value: amount,
        });

        // ── 4. 결제수단 UI + 약관 동시 렌더링 ────────────────────────
        const [paymentMethodWidget] = await Promise.all([
          widgets.renderPaymentMethods({
            selector: '#payment-method',
            variantKey: 'DEFAULT',
          }),
          widgets.renderAgreement({
            selector: '#agreement',
            variantKey: 'AGREEMENT',
          }),
        ]);

        // ── 5. 결제수단 선택 이벤트 (공식 샘플과 동일) ───────────────
        paymentMethodWidget.on('paymentMethodSelect', (selectedPaymentMethod) => {
          console.log('[TossPayments] paymentMethodSelect:', selectedPaymentMethod);
        });

        // ── 6. 위젯 표시 ──────────────────────────────────────────────
        document.getElementById('loading').style.display     = 'none';
        document.getElementById('widget-view').style.display = 'block';

        // ── 7. 결제 버튼 이벤트 (공식 샘플: addEventListener 방식) ───
        const paymentRequestButton = document.getElementById('payment-request-button');

        paymentRequestButton.addEventListener('click', async () => {
          const errEl = document.getElementById('submit-error');
          paymentRequestButton.disabled = true;
          paymentRequestButton.classList.add('loading');
          errEl.style.display = 'none';

          try {
            // 선택된 결제수단 조회 (공식 샘플 방식)
            const selectedPaymentMethod = await paymentMethodWidget.getSelectedPaymentMethod();
            console.log('[TossPayments] selectedPaymentMethod:', selectedPaymentMethod);

            // 결제 요청
            await widgets.requestPayment({
              orderId,
              orderName,
              customerName,
              customerEmail,
              successUrl,
              failUrl,
              ...(customerMobilePhone ? { customerMobilePhone } : {}),
            });
            // 성공 → successUrl로 리디렉션, 이후 코드 실행 안 됨

          } catch (err) {
            console.log('[TossPayments] requestPayment err:', err);

            // 취소(PAY_PROCESS_CANCELED / USER_CANCEL)는 조용히 처리
            if (err?.code !== 'PAY_PROCESS_CANCELED' && err?.code !== 'USER_CANCEL') {
              errEl.textContent   = err?.message || '결제 요청에 실패했습니다.';
              errEl.style.display = 'block';
            }
            paymentRequestButton.disabled = false;
            paymentRequestButton.classList.remove('loading');
          }
        });

      } catch (e) {
        console.error('[TossPayments] init error:', e);
        showError(e?.message || e?.toString() || '알 수 없는 오류가 발생했습니다.');
      }
    };

    main();
  </script>
</body>
</html>
