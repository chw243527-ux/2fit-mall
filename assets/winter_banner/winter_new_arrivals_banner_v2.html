<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>2FIT Winter New Arrivals Banner</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #dfe7eb; }
  body { font-family: Arial, "Noto Sans KR", sans-serif; }
  .banner {
    width: 1024px;
    height: 500px;
    overflow: hidden;
    position: relative;
    color: #fff;
    background: linear-gradient(112deg, #111e2a 0%, #1d3444 57%, #c8d6d9 57%, #eef1ef 100%);
  }
  .banner:before {
    content: "";
    position: absolute;
    width: 430px;
    height: 430px;
    border-radius: 50%;
    right: -110px;
    top: -160px;
    background: rgba(255,255,255,.3);
  }
  .copy {
    position: absolute;
    z-index: 3;
    left: 66px;
    top: 74px;
    width: 355px;
  }
  .eyebrow {
    display: inline-block;
    padding: 8px 13px;
    border: 1px solid rgba(255,255,255,.58);
    border-radius: 20px;
    font-size: 12px;
    letter-spacing: 2.3px;
    font-weight: 700;
  }
  h1 {
    margin: 27px 0 8px;
    font-size: 48px;
    line-height: 1.06;
    letter-spacing: -2.5px;
    font-weight: 900;
  }
  h2 {
    margin: 0;
    font-size: 23px;
    letter-spacing: -1px;
    font-weight: 700;
  }
  .desc {
    margin-top: 25px;
    color: #d5e0e5;
    font-size: 15px;
    line-height: 1.6;
    letter-spacing: -.3px;
  }
  .cta {
    display: inline-flex;
    align-items: center;
    gap: 16px;
    margin-top: 31px;
    padding: 14px 20px;
    border-radius: 3px;
    background: #fff;
    color: #142534;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: .2px;
  }
  .cta span { font-size: 19px; line-height: 10px; }
  .products {
    position: absolute;
    z-index: 2;
    right: 28px;
    bottom: -30px;
    width: 560px;
    height: 475px;
  }
  .product {
    position: absolute;
    bottom: 0;
    width: 230px;
    height: 450px;
    object-fit: contain;
    object-position: bottom center;
    filter: drop-shadow(0 16px 12px rgba(24,42,50,.22));
  }
  .p1 { left: 0; width: 245px; height: 410px; transform: rotate(-5deg); }
  .p2 { left: 108px; width: 270px; height: 475px; z-index: 3; }
  .p3 { left: 240px; width: 250px; height: 425px; transform: rotate(5deg); z-index: 2; }
  .p4 { left: 350px; width: 220px; height: 365px; transform: rotate(9deg); z-index: 1; opacity: .92; }
  .snow { position: absolute; z-index: 1; right: 85px; top: 78px; color: rgba(255,255,255,.68); font-size: 88px; font-weight: 200; }
  .foot { position: absolute; z-index: 3; left: 67px; bottom: 28px; font-size: 10px; letter-spacing: 1.2px; color: #99acb7; }
</style>
</head>
<body>
  <main class="banner">
    <div class="snow">✳</div>
    <section class="copy">
      <div class="eyebrow">2FIT WINTER 2026</div>
      <h1>겨울 신상품</h1>
      <h2>움직임을 위한 따뜻한 레이어</h2>
      <p class="desc">가볍고 따뜻한 패딩부터 데일리 레이어까지<br>2FIT의 새로운 겨울 컬렉션을 만나보세요.</p>
      <div class="cta">겨울 컬렉션 보러가기 <span>→</span></div>
    </section>
    <section class="products" aria-label="겨울 신상품 제품 이미지">
      <img class="product p1" src="64198.png" alt="겨울 신상품">
      <img class="product p2" src="64230.png" alt="겨울 신상품">
      <img class="product p3" src="64228.png" alt="겨울 신상품">
      <img class="product p4" src="64213.png" alt="겨울 신상품">
    </section>
    <div class="foot">NEW ARRIVALS / READY FOR WINTER</div>
  </main>
</body>
</html>
