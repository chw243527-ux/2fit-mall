name: Android Internal Test AAB

on:
  workflow_dispatch:
    inputs:
      build_name:
        description: 'Android version name'
        required: true
        default: '1.0.26'
      build_number:
        description: 'Android version code (leave blank for automatic increment)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: android-internal-aab
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.32.2'
  VERSION_CODE_BASE: '1000'

jobs:
  build:
    name: Build signed internal-test AAB
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Android API 36 SDK
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$sdk_root" ] || [ ! -d "$sdk_root" ]; then
            echo 'Android SDK root was not found.'
            exit 1
          fi
          sdkmanager_path="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$sdkmanager_path" ]; then
            sdkmanager_path="$(find "$sdk_root/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          fi
          if [ -z "$sdkmanager_path" ] || [ ! -x "$sdkmanager_path" ]; then
            echo "sdkmanager was not found under $sdk_root/cmdline-tools"
            find "$sdk_root" -maxdepth 4 -type f -name sdkmanager -print || true
            exit 1
          fi
          yes | "$sdkmanager_path" --licenses >/dev/null 2>&1 || true
          "$sdkmanager_path" "platforms;android-36"

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Prepare existing upload key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "Missing GitHub Secret: ${name}"
              exit 1
            fi
          done
          umask 077
          # Normalize values copied from text files so trailing CR/LF cannot corrupt signing.
          store_password="$(printf '%s' "$ANDROID_KEYSTORE_PASSWORD" | tr -d '\r\n')"
          key_password="$(printf '%s' "$ANDROID_KEY_PASSWORD" | tr -d '\r\n')"
          key_alias="$(printf '%s' "$ANDROID_KEY_ALIAS" | tr -d '\r\n')"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n' | base64 --decode > android/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$store_password
          # This upload keystore is PKCS12; Android Gradle signing requires the store password for the key password.
          keyPassword=$store_password
          keyAlias=$key_alias
          storeFile=../upload-keystore.jks
          EOF

      - name: Validate signing credentials
        run: |
          set -euo pipefail
          store_password="$(printf '%s' '${{ secrets.ANDROID_KEYSTORE_PASSWORD }}' | tr -d '\r\n')"
          key_password="$(printf '%s' '${{ secrets.ANDROID_KEY_PASSWORD }}' | tr -d '\r\n')"
          key_alias="$(printf '%s' '${{ secrets.ANDROID_KEY_ALIAS }}' | tr -d '\r\n')"
          echo "keystore_size=$(wc -c < android/upload-keystore.jks) bytes"
          echo "store_password_length=${#store_password}"
          echo "key_password_length=${#key_password}"
          echo "key_alias=$key_alias"
          if ! keytool -list -v \
            -keystore android/upload-keystore.jks \
            -storepass "$store_password" \
            -alias "$key_alias" \
            -keypass "$key_password" \
            > /tmp/signing-check.txt 2>/tmp/signing-check.err; then
            echo 'Signing credential validation failed.'
            echo 'Check that ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_PASSWORD are in the correct fields.'
            cat /tmp/signing-check.err
            exit 1
          fi
          grep -E 'Alias name:|SHA1:' /tmp/signing-check.txt
          echo 'Signing credential validation passed.'

      - name: Calculate automatic Android version
        id: version
        env:
          INPUT_BUILD_NAME: ${{ inputs.build_name }}
          INPUT_BUILD_NUMBER: ${{ inputs.build_number }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          build_name="$INPUT_BUILD_NAME"
          if [ -z "$build_name" ]; then
            build_name="$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml | head -1)"
          fi
          test -n "$build_name"
          if [ -n "$INPUT_BUILD_NUMBER" ]; then
            build_number="$INPUT_BUILD_NUMBER"
          else
            build_number=$((VERSION_CODE_BASE + RUN_NUMBER))
          fi
          case "$build_number" in
            ''|*[!0-9]*) echo 'build_number must be a positive integer.'; exit 1 ;;
          esac
          if [ "$build_number" -lt 1 ]; then
            echo 'build_number must be greater than zero.'
            exit 1
          fi
          echo "build_name=$build_name" >> "$GITHUB_OUTPUT"
          echo "build_number=$build_number" >> "$GITHUB_OUTPUT"
          echo "Building ${build_name}+${build_number}"

      - name: Build signed Release AAB
        run: |
          set -euo pipefail
          flutter build appbundle --release \
            --build-name="${{ steps.version.outputs.build_name }}" \
            --build-number="${{ steps.version.outputs.build_number }}"
          test -s build/app/outputs/bundle/release/app-release.aab

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: 2fit-mall-internal-${{ steps.version.outputs.build_name }}-${{ steps.version.outputs.build_number }}
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Cleanup signing files
        if: always()
        run: rm -f android/upload-keystore.jks android/key.properties

      - name: Build summary
        if: success()
        run: |
          {
            echo '## Internal test AAB ready'
            echo
            echo '- Version: ${{ steps.version.outputs.build_name }}+${{ steps.version.outputs.build_number }}'
            echo '- Artifact: app-release.aab'
            echo '- Signed with the existing upload-key GitHub Secrets'
          } >> "$GITHUB_STEP_SUMMARY"
      
      
