name: Build & Deploy — Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_cache:
        description: 'pub/Flutter 캐시 무시 (패키지 오류 시 true)'
        required: false
        default: 'false'
        type: boolean

# 동일 브랜치 중복 실행 방지
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.32.2'
  WRANGLER_VERSION: '3.78.12'
  BUILD_DIR: build/web
  CF_PROJECT: twofit-mall

jobs:
  build_and_deploy:
    name: Flutter Build → Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # ── 0. 소스 체크아웃 (shallow clone — 히스토리 불필요)
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ── 1. Flutter SDK + 캐시
      - name: Setup Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: ${{ github.event.inputs.skip_cache != 'true' }}
          cache-key: flutter-${{ runner.os }}-${{ env.FLUTTER_VERSION }}

      # ── 2. pub 패키지 캐시 (pubspec.lock 해시 기반 — 변경 없으면 100% hit)
      - name: Cache pub packages
        if: github.event.inputs.skip_cache != 'true'
        uses: actions/cache@v4
        id: pub-cache
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      # ── 3. wrangler 전역 설치 캐시 (버전 고정 → 항상 hit)
      - name: Cache wrangler install
        uses: actions/cache@v4
        id: wrangler-cache
        with:
          path: ~/.npm/_npx
          key: wrangler-${{ env.WRANGLER_VERSION }}

      # ── 4. 의존성 설치 (캐시 hit 시 약 5초, miss 시 약 60초)
      - name: Install Flutter dependencies
        run: flutter pub get

      # ── 5. Flutter 웹 릴리즈 빌드
      #   --tree-shake-icons 제거(기본 활성화)로 빌드 크기↓ 속도↑
      #   --source-maps 제거 (배포 불필요)
      - name: Build Flutter Web (release)
        run: |
          flutter build web \
            --release \
            --tree-shake-icons \
            --pwa-strategy=offline-first \
            --dart-define=BUILD_NUMBER=${{ github.run_number }} \
            --dart-define=BUILD_SHA=${{ github.sha }}

      # ── 6. 빌드 후 캐시버스팅 패치
      - name: Patch build output (cache busting)
        run: |
          BUILD_VER="${{ github.run_number }}"
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)

          # flutter_bootstrap.js — main.dart.js?v= 쿼리 추가
          sed -i \
            "s|main\.dart\.js\"|main.dart.js?v=${BUILD_VER}\"|g" \
            ${{ env.BUILD_DIR }}/flutter_bootstrap.js

          # index.html — BUILD_NUMBER 플레이스홀더를 실제 빌드 번호로 교체
          if [ -f "${{ env.BUILD_DIR }}/index.html" ]; then
            sed -i \
              "s|flutter-app-cache-BUILD_NUMBER|flutter-app-cache-${BUILD_VER}|g" \
              ${{ env.BUILD_DIR }}/index.html
            echo "✅ index.html BUILD_NUMBER → ${BUILD_VER} 교체 완료"
          else
            echo "❌ index.html 없음"
            exit 1
          fi

          # flutter_service_worker.js 패치
          if [ -f "${{ env.BUILD_DIR }}/flutter_service_worker.js" ]; then
            sed -i \
              "s|main\.dart\.js|main.dart.js?v=${BUILD_VER}|g" \
              ${{ env.BUILD_DIR }}/flutter_service_worker.js
            # CACHE_NAME을 빌드 번호로 교체 → 새 빌드마다 SW가 기존 캐시 무효화
            sed -i \
              "s|'flutter-app-cache'|'flutter-app-cache-${BUILD_VER}'|g" \
              ${{ env.BUILD_DIR }}/flutter_service_worker.js
            sed -i \
              "s|'flutter-temp-cache'|'flutter-temp-cache-${BUILD_VER}'|g" \
              ${{ env.BUILD_DIR }}/flutter_service_worker.js
            echo "// build: ${BUILD_VER} (${SHORT_SHA})" \
              >> ${{ env.BUILD_DIR }}/flutter_service_worker.js
          else
            echo "❌ flutter_service_worker.js 없음"
            exit 1
          fi

      # ── 7. Firebase Firestore Rules 배포
      # FIREBASE_TOKEN secret이 없으면 이 스텝은 실패하지만 continue-on-error로 무시됨
      - name: Deploy Firebase Firestore Rules
        continue-on-error: true
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -z "$FIREBASE_TOKEN" ]; then
            echo "⚠️  FIREBASE_TOKEN 미설정 — Rules 배포 건너뜀"
            exit 0
          fi
          npm install -g firebase-tools --silent
          firebase deploy --only firestore:rules --token "$FIREBASE_TOKEN" --non-interactive

      # ── 8. Cloudflare Pages 배포
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          npx wrangler@${{ env.WRANGLER_VERSION }} pages deploy \
            ${{ env.BUILD_DIR }} \
            --project-name="${{ env.CF_PROJECT }}" \
            --branch=main \
            --commit-dirty=true \
            --commit-message="deploy: build-${{ github.run_number }} (${SHORT_SHA})"

      # ── 9. Cloudflare 캐시 purge
      - name: Purge Cloudflare cache
        if: success()
        run: |
          curl -s -X POST \
            "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{
              "files": [
                "https://2fit-mall.co.kr/",
                "https://2fit-mall.co.kr/index.html",
                "https://2fit-mall.co.kr/flutter_service_worker.js",
                "https://2fit-mall.co.kr/main.dart.js",
                "https://2fit-mall.co.kr/flutter.js",
                "https://2fit-mall.co.kr/flutter_bootstrap.js",
                "https://2fit-mall.co.kr/manifest.json"
              ]
            }' | python3 -c "
          import sys, json
          r = json.load(sys.stdin)
          if r.get('success'):
              print('✅ Cloudflare 캐시 purge 성공')
          else:
              print('⚠️  purge 응답:', json.dumps(r, ensure_ascii=False))
          " || echo "⚠️  CLOUDFLARE_ZONE_ID 미설정 — purge 건너뜀"

      # ── 10. 배포 완료 Summary
      - name: Deployment summary
        if: success()
        run: |
          echo "## ✅ 배포 완료" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 항목 | 값 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| 빌드 번호 | #${{ github.run_number }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 커밋 | \`$(echo '${{ github.sha }}' | cut -c1-7)\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Flutter | ${{ env.FLUTTER_VERSION }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🌐 https://2fit-mall.co.kr" >> $GITHUB_STEP_SUMMARY

      # ── 11. 실패 시 로그 업로드
      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-logs-${{ github.run_number }}
          path: |
            pubspec.lock
          retention-days: 3
