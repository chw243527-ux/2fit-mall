name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build web (release)
        run: flutter build web --release --no-tree-shake-icons

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm install -g wrangler
          # Cloudflare API does not accept non-ASCII commit messages.
          # Override commit message and author with ASCII-safe values.
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          RUN_NUM="${{ github.run_number }}"
          wrangler pages deploy build/web \
            --project-name=twofit-mall \
            --commit-dirty=true \
            --commit-message="deploy: build-${RUN_NUM} (${SHORT_SHA})" \
            --commit-hash="${{ github.sha }}"
