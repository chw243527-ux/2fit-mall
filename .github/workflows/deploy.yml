name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build web (release)
        run: flutter build web --release --no-tree-shake-icons

      - name: Patch renderer to html
        run: sed -i 's/"renderer":"canvaskit"/"renderer":"html"/g' build/web/flutter_bootstrap.js

      - name: Patch JS cache busting (append build number to main.dart.js)
        run: |
          BUILD_VER="${{ github.run_number }}"
          # flutter_bootstrap.js 안의 main.dart.js 참조에 ?v=빌드번호 추가
          sed -i "s/main\.dart\.js\"/main.dart.js?v=${BUILD_VER}\"/g" build/web/flutter_bootstrap.js
          # index.html 안의 참조도 패치
          sed -i "s/main\.dart\.js\"/main.dart.js?v=${BUILD_VER}\"/g" build/web/index.html
          echo "Patched main.dart.js → main.dart.js?v=${BUILD_VER}"

      - name: Install wrangler (fixed version)
        run: npm install -g wrangler@3.78.12

      - name: Deploy to Cloudflare Pages (Production)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          RUN_NUM="${{ github.run_number }}"
          wrangler pages deploy build/web \
            --project-name=twofit-mall \
            --branch=main \
            --commit-dirty=true \
            --commit-message="deploy: build-${RUN_NUM} (${SHORT_SHA})" \
            --commit-hash="${{ github.sha }}"
