name: Dart Analyze Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dart-analyze-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.32.2'

jobs:
  dart-analyze:
    name: Dart analyze (zero diagnostics required)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Check Dart formatting
        run: bash tool/ci_dart_format.sh

      - name: Check dart fix suggestions
        run: bash tool/ci_dart_fix.sh

      - name: Run project custom lint
        run: bash tool/ci_custom_lint.sh

      - name: Enforce zero Dart diagnostics
        run: bash tool/ci_dart_analyze.sh
